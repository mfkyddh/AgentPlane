schema_version: 2
app_id: sub2api

artifact:
  build_command: "echo 'sub2api uses upstream image ghcr.io/wei-shaw/sub2api — no local build step'"
  output_path: "dist/placeholder"
  runtime_os: "linux"
  runtime_arch: "amd64"

packaging:
  backend: wsl-linux
  image_name: ghcr.io/wei-shaw/sub2api
  image_tag_rule: "<upstream>-zzz.<yyyymmdd>.v<n>.g<gitsha>"
  package_command: "echo 'sub2api uses upstream image — no local package step'"

runtime:
  kind: compose
  container_name: sub2api-dev
  container_port: 8080
  host_binding: "0.0.0.0:18080"
  healthcheck:
    path: /health
    expected_status: 200
  env_template: "templates/services/sub2api.wsl.env.example"

infra:
  depends_on_containers:
    - postgres18-dev
    - redis7-dev
  tenant_resources:
    postgres:
      database: sub2api_wsl
      user: sub2api_wsl
      secret_file: secrets/hosts/wsl/apps/sub2api/resources/postgres.env
    redis:
      db: 1
      key_prefix: "sub2api:wsl:"
      secret_file: secrets/hosts/wsl/apps/sub2api/resources/redis.env

ingress:
  mode: internal

data:
  mounts:
    - host_path: /data/sub2api/data
      container_path: /app/data

rollback:
  previous_control_plane:
    kind: none
