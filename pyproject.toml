[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentplane-cli"
version = "0.2.0"
description = "Agent-first control plane CLI and template repository"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "AgentPlane Maintainers" },
]
keywords = ["agentplane", "control-plane", "deployment", "automation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.34.0",
  "websockets>=15.0",
]

[project.optional-dependencies]
web = [
  "anthropic>=0.40.0",
]

[project.scripts]
agentplane = "agentplane.cli.app:main"

[dependency-groups]
dev = [
  "build>=1.4.4",
  "coverage[toml]>=7.13.5",
  "pip-audit>=2.10.0",
  "pygments>=2.20.0",
  "pre-commit>=4.2.0",
  "pytest>=9.0.3",
  "pytest-cov>=6.0",
  "pytest-rerunfailures>=16.0",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8.0",
  "httpx>=0.28.1",
  "playwright>=1.50.0",
  "pytest-playwright>=0.6.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not live_gate and not integration_wsl and not integration_remote and not external_app and not docker_required and not ssh_required' --dist loadfile"
markers = [
  "anyio: async test using anyio backend",
  "flaky: test is flaky and will be retried on failure",
  "unit: Pure functions, no I/O, no global mutable state, <10ms",
  "integration: Module composition, mocked externals, tmpdir allowed, <100ms",
  "e2e: Full CLI subprocess launch, >1s acceptable",
  "golden: Core module smoke test — one per module, proves basic functionality",
  "live_gate: requires the real WSL/SSH/Docker live integration gate",
  "integration_wsl: requires a real WSL/Linux backend from the current host",
  "integration_remote: requires a real remote host, SSH target, or provider endpoint",
  "external_app: requires an external application repository outside AgentPlane",
  "docker_required: requires a live Docker daemon",
  "ssh_required: requires live SSH transport",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["agentplane", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source = ["agentplane"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 48  # Will be raised to 55+ after Beta M4/M5 test coverage improvements

[tool.hatch.build.targets.wheel]
packages = ["agentplane"]
