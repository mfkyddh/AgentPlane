[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "agentplane-cli"
version = "0.1.0"
description = "Agent-first control plane CLI and template repository"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
  { name = "AgentPlane Maintainers" },
]
keywords = ["agentplane", "control-plane", "deployment", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
dependencies = [
  "PyYAML>=6.0",
]

[project.scripts]
agentplane = "agentplane.cli.app:main"

[dependency-groups]
dev = [
  "pytest>=8.4.2",
  "pytest-xdist>=3.8.0",
  "ruff>=0.8.0",
]

[tool.pytest.ini_options]
addopts = "-m 'not live_gate and not integration_wsl and not integration_remote and not external_app and not docker_required and not ssh_required'"
markers = [
  "unit: Pure functions, no I/O, no global mutable state, <10ms",
  "integration: Module composition, mocked externals, tmpdir allowed, <100ms",
  "e2e: Full CLI subprocess launch, >1s acceptable",
  "smoke: Fastest e2e per module for quick regression",
  "live_gate: requires the real WSL/SSH/Docker live integration gate",
  "integration_wsl: requires a real WSL/Linux backend from the current host",
  "integration_remote: requires a real remote host, SSH target, or provider endpoint",
  "external_app: requires an external application repository outside AgentPlane",
  "docker_required: requires a live Docker daemon",
  "ssh_required: requires live SSH transport",
]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["agentplane", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["agentplane"]
