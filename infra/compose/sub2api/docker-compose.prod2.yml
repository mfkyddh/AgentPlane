# 这是一份 Sub2API 的 2号生产机编排文件。
# 文件保存在 infra/compose/sub2api 目录下。

services:
  sub2api:
    image: ${SUB2API_IMAGE_REF:-sub2api-prod:latest}
    container_name: sub2api-prod
    restart: unless-stopped

    env_file:
      - ../../../secrets/services/sub2api.prod2.env

    ports:
      - "127.0.0.1:18080:8080"

    volumes:
      - /data/sub2api/data:/app/data

    environment:
      DATABASE_HOST: postgres18-prod
      REDIS_HOST: redis7-prod

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
