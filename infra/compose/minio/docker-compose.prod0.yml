# 这是一份 0号生产机 MinIO 编排文件。
# 文件保存在 infra/compose/minio 目录下。

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-prod
    restart: unless-stopped
    mem_limit: 320m
    mem_reservation: 160m
    memswap_limit: 320m

    env_file:
      - ../../../secrets/services/minio/admin.prod0.env

    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"

    environment:
      TZ: Asia/Shanghai
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""
      GOMEMLIMIT: "160MiB"
      GOGC: "30"

    volumes:
      - /data/minio/data:/data
      - /data/minio/config:/root/.minio

    command: server --address ":9000" --console-address ":9001" /data

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
