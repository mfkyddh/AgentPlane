# 这是一份 MinIO 的 WSL 测试环境编排文件。
# 文件保存在 infra/compose/minio 目录下。

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-dev
    restart: unless-stopped
    # WSL 仅保留基础开发调试所需的内存余量，避免 MinIO 长时间占用过多资源。
    mem_limit: 384m
    memswap_limit: 384m

    env_file:
      - ../../../secrets/services/minio/admin.wsl.env

    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"

    environment:
      TZ: Asia/Shanghai
      MINIO_COMPRESS: "off"
      MINIO_COMPRESS_EXTENSIONS: ""
      MINIO_COMPRESS_MIME_TYPES: ""

    volumes:
      - /data/minio/data:/data
      - /data/minio/config:/root/.minio

    command: server --address ":9000" --console-address ":9001" /data

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
