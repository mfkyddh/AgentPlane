services:
  newapi:
    image: ${NEWAPI_IMAGE_REF:-newapi-dev:local}
    container_name: newapi-dev
    restart: unless-stopped

    command: ["--log-dir", "/app/logs"]

    env_file:
      - /root/work/AgentPlane/secrets/services/newapi.wsl.env

    ports:
      - "0.0.0.0:3000:3000"

    volumes:
      - /data/newapi/data:/data
      - /data/newapi/logs:/app/logs

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
