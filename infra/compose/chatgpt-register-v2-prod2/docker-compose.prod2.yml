services:
  chatgpt-register-v2-prod2:
    image: ${CHATGPT_REGISTER_V2_IMAGE_REF:-chatgpt-register-v2-prod:latest}
    container_name: chatgpt-register-v2-prod2
    restart: unless-stopped

    env_file:
      - ../../../secrets/services/chatgpt-register-v2-prod2.prod2.env

    ports:
      - "127.0.0.1:18082:18082"

    volumes:
      - /data/chatgpt-register-v2-prod2/data:/data

    init: true

    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - import urllib.request; urllib.request.urlopen("http://127.0.0.1:18082/healthz", timeout=5).read()
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
