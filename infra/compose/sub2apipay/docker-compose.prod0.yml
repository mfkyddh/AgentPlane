services:
  sub2apipay:
    image: ${SUB2APIPAY_IMAGE_REF:-sub2apipay-prod:latest}
    container_name: sub2apipay-prod
    restart: unless-stopped

    env_file:
      - ../../../secrets/services/sub2apipay.prod0.env

    ports:
      - "127.0.0.1:18091:3000"

    volumes:
      - /data/sub2apipay/data:/data

    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/pay"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

    networks:
      - zqf_network

networks:
  zqf_network:
    external: true
