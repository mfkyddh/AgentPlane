# Codex local environment contract for AgentPlane.
# Field layout is intentionally thin: heavy logic stays in setup/actions scripts.

[setup]
default = "bash .codex/environments/setup/setup.sh"
linux = "bash .codex/environments/setup/setup.linux.sh"
windows = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/setup/setup.windows.ps1"

[[actions]]
name = "Bootstrap"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/bootstrap.ps1"

[[actions]]
name = "Test"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/test.ps1"

[[actions]]
name = "Lint"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/lint.ps1"

[[actions]]
name = "Build"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/build.ps1"

[[actions]]
name = "Dev"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/dev.ps1"

[[actions]]
name = "Compose Up"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/compose-up.ps1"

[[actions]]
name = "Compose Logs"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/compose-logs.ps1"

[[actions]]
name = "Smoke"
command = "pwsh -NoProfile -ExecutionPolicy Bypass -File .codex/environments/actions/smoke.ps1"
