name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  fast-gate:
    name: Fast gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate commit messages
        env:
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || github.sha }}
        run: uv run python -m agentplane.domain.project.commit_message --range-env COMMIT_RANGE

      - name: Run fast test gate
        run: uv run python -m agentplane.cli test fast --tb=short

      - name: Run documentation sanity gate
        run: uv run python -m agentplane.cli project docs-sanity --repo-root .

      - name: Run skills sync check
        run: uv run python -m agentplane.cli project skills check --repo-root .

      - name: Run secret scan
        run: uv run python -m agentplane.cli project secret-scan --repo-root .

      - name: Run privacy scan
        run: uv run python -m agentplane.cli project privacy-scan --repo-root .

  release-gate:
    name: Release gate
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate commit messages
        env:
          COMMIT_RANGE: ${{ github.sha }}
        run: uv run python -m agentplane.domain.project.commit_message --range-env COMMIT_RANGE

      - name: Run release check
        run: uv run python -m agentplane.cli project release-check --repo-root .
