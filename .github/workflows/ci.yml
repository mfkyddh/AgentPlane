name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  default-gate:
    name: Default gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Run default pytest gate
        run: uv run python -m pytest

      - name: Verify CLI help
        run: uv run python -m agentplane.cli --help

