name: CI

on:
  workflow_dispatch:  # 手动触发 only — 快速迭代期间关闭自动 CI

jobs:
  default-gate:
    name: Default gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv

      - name: Validate commit messages
        env:
          COMMIT_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.sha) || github.sha }}
        run: uv run python -m agentplane.domain.repository.commit_message --range-env COMMIT_RANGE

      - name: Run repository health check
        run: uv run python -m agentplane.cli repo health-check --repo-root .
